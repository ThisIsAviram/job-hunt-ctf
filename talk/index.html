<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>שיח אסטרטגי · מחלקת הפיתוח</title>
<style>
html,body{margin:0;height:100%;background:#062F6A;color:#fff;font-family:Assistant,'Open Sans',Arial,sans-serif}
.box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(440px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(133,217,255,.35);border-radius:18px;padding:34px 30px}
h1{margin:0 0 6px;font-size:28px}p{margin:0 0 22px;color:#C7EAFB;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:10px;border:1px solid #85D9FF;background:#041f47;color:#fff;font-size:18px;direction:ltr;text-align:left}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:10px;background:#C8102E;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.err{color:#FFB3BC;min-height:22px;margin-top:10px}.foot{margin-top:18px;font-size:13px;color:#8FB6DA}
</style></head><body><div class="box"><form class="card" id="f" action="javascript:void 0">
<h1>מי יבנה את העתיד?</h1><p>המצגת מהשיח האסטרטגי. היא נשלחה רק למשתתפי המפגש, ולכן נדרשת סיסמה.</p>
<input id="p" type="password" autocomplete="off" placeholder="סיסמה" aria-label="סיסמה" required>
<button id="b">פתיחה</button><div class="err" id="e" role="alert"></div>
<div class="foot">פנימי. נא לא להעביר הלאה בלי אישור.</div></form></div>
<script>
const D={s:"bvky0aDnTVS42SaiFj+95g==",i:"bi1KzXj/s1QRln3g",n:600000,bytes:10850094};
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// the encrypted deck is a separate file, prefetched while the person types, with progress on the button
let CT=null, got=0; const bar=()=>{const b=document.getElementById("b"); if(b&&!CT&&b.disabled) b.textContent="טוען… "+Math.round(got/D.bytes*100)+"%";};
const load=(async()=>{const r=await fetch("deck.enc",{cache:"no-cache"}); const rd=r.body.getReader(); const parts=[];
  for(;;){const {done,value}=await rd.read(); if(done)break; parts.push(value); got+=value.length; bar();}
  const all=new Uint8Array(got); let o=0; for(const p of parts){all.set(p,o); o+=p.length;} CT=all; return all;})();
async function open(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass.normalize("NFKC")),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,await load));
  history.replaceState(null,"",location.pathname);
  document.open();document.write(html);document.close();
}
async function go(pass){const b=document.getElementById("b"),e=document.getElementById("e");b.disabled=true;b.textContent=CT?"פותח…":"טוען… "+Math.round(got/D.bytes*100)+"%";e.textContent="";
  try{await open(pass)}catch(_){b.disabled=false;b.textContent="פתיחה";e.textContent="הסיסמה לא נכונה";}}
document.getElementById("f").onsubmit=ev=>{ev.preventDefault();go(document.getElementById("p").value.trim())};
const m=location.hash.match(/[#&]p=([^&]+)/); if(m) go(decodeURIComponent(m[1]));
</script></body></html>
